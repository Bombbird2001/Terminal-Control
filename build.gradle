buildscript {
    ext.kotlin_version = '2.1.20'

    repositories {
        mavenLocal()
        mavenCentral()
        //jcenter()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://repo.spring.io/plugins-release/" }
        maven { url "https://maven.scijava.org/content/repositories/public/" }
        google()
    }

    dependencies {
        classpath 'org.wisepersist:gwt-gradle-plugin:1.1.19'
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'com.mobidevelop.robovm:robovm-gradle-plugin:2.3.23'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    apply plugin: "idea"

    version = '1.5.2111.2'
    ext {
        appName = "Terminal Control"
        gdxVersion = '1.13.5'
        roboVMVersion = '2.3.23'
        versionCode = 84
    }

    repositories {
        google()
        mavenLocal()
        mavenCentral()
        //jcenter()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
//        maven { url "https://repo.spring.io/plugins-release/" }
        maven { url "https://maven.scijava.org/content/repositories/public/" }
        maven { url "https://artifactory.appodeal.com/appodeal" }
    }
}

configurations.all {
    exclude group: "junit", module: "junit"
}

project(":desktop") {
    apply plugin: "java"
    apply plugin: "kotlin"

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        implementation "club.minnced:java-discord-rpc:2.0.2"
        implementation "club.minnced:discord-rpc-release:v3.3.0"
        implementation files('../extJars/jAdapterForNativeTTS-0.12.0.jar')

//        testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
        testImplementation(platform("org.junit:junit-bom:5.13.4"))
        testImplementation("org.junit.jupiter:junit-jupiter")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    }

    test {
        useJUnitPlatform()
    }

    task assetsLiteFullTest(type: Test) {
        workingDir "../android/assetsLiteFull"

        // Enable JUnit 5 (Gradle 4.6+).
        useJUnitPlatform()

        // Always run tests, even when nothing changed.
        dependsOn 'cleanAssetsLiteFullTest'

        // Show test results.
        testLogging {
            events "passed", "skipped", "failed"
        }
    }

    task assetsLiteTest(type: Test) {
        workingDir "../android/assetsLite"

        // Enable JUnit 5 (Gradle 4.6+).
        useJUnitPlatform()

        // Always run tests, even when nothing changed.
        dependsOn 'cleanAssetsLiteTest'

        // Show test results.
        testLogging {
            events "passed", "skipped", "failed"
        }
    }
}

project(":android") {
    apply plugin: "android"
    apply plugin: "kotlin-android"

    configurations { natives }

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
        implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        implementation "com.google.android.gms:play-services-games:23.2.0"
        implementation "com.google.android.gms:play-services-auth:21.4.0"
        implementation "com.google.api-client:google-api-client-android:2.8.1"
        implementation "com.google.apis:google-api-services-drive:v3-rev197-1.25.0"
        implementation "com.google.http-client:google-http-client-gson:2.0.0"
        implementation "com.google.android.gms:play-services-ads-identifier:18.2.0"
        implementation "com.google.android.gms:play-services-base:18.7.2"
        implementation "com.pollfish:pollfish-googleplay:6.5.0"
        //noinspection GradleDynamicVersion
        implementation "com.appodeal.ads:sdk:3.3.3.0"
    }
}

project(":ios") {
    apply plugin: "java"
    apply plugin: "robovm"
    apply plugin: "kotlin"

    dependencies {
        implementation project(":core")
        implementation "com.mobidevelop.robovm:robovm-rt:$roboVMVersion"
        implementation "com.mobidevelop.robovm:robovm-cocoatouch:$roboVMVersion"
        implementation "com.badlogicgames.gdx:gdx-backend-robovm:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-ios"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-ios"
    }
}

project(":core") {
    apply plugin: "java"
    apply plugin: "kotlin"

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        api "com.squareup.okhttp3:okhttp:5.1.0"
        api "org.json:json:20230227"
        api "org.apache.commons:commons-lang3:3.18.0"
    }
}